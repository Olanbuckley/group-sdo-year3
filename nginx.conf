server {
    # This is the crucial line: it ensures Nginx binds to the port 
    # specified by the Cloud Run environment variable $PORT.
    listen $PORT;
    listen [::]:$PORT; # Optional, but good practice for IPv6

    # Set the root directory to where the React build files are copied
    root /usr/share/nginx/html;
    index index.html index.htm;
    
    # Handle client-side routing (for React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}